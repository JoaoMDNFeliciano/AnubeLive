<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AnubeLive</title>
  <meta name="description" content="Classificações ao vivo das provas cronometradas pela Anube Sport">
  <meta name="theme-color" content="#0e1116">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <button id="back" class="icon-btn" aria-label="Voltar" hidden>‹</button>
    <h1 id="title">AnubeLive</h1>
    <button id="liveBtn" class="btn small" hidden>Ao vivo</button>
    <button id="themeBtn" class="icon-btn" aria-label="Modo dia / noite" title="Modo dia / noite">☀</button>
    <button id="settingsBtn" class="icon-btn" aria-label="Definições">⚙</button>
  </header>
  <main id="view"></main>
  <div id="toasts" aria-live="polite"></div>
  <dialog id="settings"></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
